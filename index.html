<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Weather APP</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./style.css" type="text/css" media="screen" />

    <!-- Place favicon.ico in the root directory -->

</head>
    <body>
        <div class="wrapper">
            <main>
                <div class="img-container">
                    <img/>
                </div>
                <form action="#">
                    <div class="search-sec">
                        <input type="text" id="city" placeholder="Search city"/>
                        <button type="button" class="search-btn">
                            Search
                        </button>
                    </div>
                    <!-- Un switch -->
                    <div class="temp-selector">
                        <div>
                            <input type="radio" id="celsius" name="temp" value="metric" checked/>
                            <label for="celsius">°C</label>
                        </div>
                        <div>
                            <input type="radio" id="fahrenheit" name="temp" value="us"/>
                            <label for="fahrenheit">°F</label>
                        </div>
                    </div>
                </form>

                <section class="sec-1 general-info">
                    <!-- <h1 class="city-name">Current conditions</h1> -->
                    <h1 class="title">Current conditions</h1>
                    <p class="today-date"></p>
                    <p class="today-time"></p>
                    <p class="temperature"></p>
                    <!-- <p class="description"></p> -->
                    <p class="conditions"></p>
                </section>

                <section class="sec-2" >
                    <h1>Weather details</h1>
                    <div class="grid-info">

                    </div>
                </section>

                <section class="sec-3" >
                    <h1>Five day weather forecast</h1>
                    <div class="grid-info-2">

                    </div>
                </section>

            </main>
        </div>
        <script type="text/javascript" src="./main.js"></script>
    </body>

</html>
